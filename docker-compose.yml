# docker-compose.yml — os 6 containers do projeto e como se ligam.
# Sobe tudo com `docker compose up -d --build`. Valores ${ASSIM} vêm do .env.
# Os containers se enxergam pelo NOME do serviço (ex.: a API acessa "mosquitto:1883").
#
#   placa -> mosquitto -> telegraf -> influxdb -> grafana     (histórico/gráficos)
#   navegador -> web (Next.js) -> api (FastAPI) -> mosquitto -> placa   (controle)
name: cultivia

services:
  # ---------------------------------------------------------------
  # Broker MQTT: recebe e distribui as mensagens entre placa, API e Telegraf.
  # ---------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cultivia-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    # Senhas dos 3 usuários MQTT, usadas pelo `command` abaixo.
    environment:
      MQTT_ESP32_PASSWORD: ${MQTT_ESP32_PASSWORD}
      MQTT_API_PASSWORD: ${MQTT_API_PASSWORD}
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD}
    # Em vez de guardar senhas num arquivo do repositório, este script gera o
    # /mosquitto/passwd a cada start e depois inicia o broker.
    # (`$$` = um `$` literal; com um só, o compose trocaria pelo valor do .env.)
    #  1. rm -f                apaga o arquivo antigo (recriar direto dá "File exists")
    #  2. mosquitto_passwd -c  cria com o usuário esp32; os outros são acrescentados
    #  3. chown                o Mosquitto roda como usuário `mosquitto` e precisa ser dono
    #  4. exec mosquitto       troca o shell pelo broker (vira o processo principal)
    command:
      - sh
      - -c
      - |
        rm -f /mosquitto/passwd &&
        mosquitto_passwd -b -c /mosquitto/passwd esp32 "$$MQTT_ESP32_PASSWORD" &&
        mosquitto_passwd -b /mosquitto/passwd api "$$MQTT_API_PASSWORD" &&
        mosquitto_passwd -b /mosquitto/passwd telegraf "$$MQTT_TELEGRAF_PASSWORD" &&
        chown mosquitto:mosquitto /mosquitto/passwd &&
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl:/mosquitto/config/acl:ro   # quem pode o quê (ver o arquivo)
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    # "Saudável" quando o usuário `api` consegue assinar um tópico.
    # Telegraf e API só sobem depois disso (depends_on ... service_healthy).
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u api -P \"$$MQTT_API_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3 -i healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # InfluxDB: banco de séries temporais, guarda o histórico das leituras.
  # As variáveis INIT só valem na PRIMEIRA vez (volume vazio).
  # ---------------------------------------------------------------
  influxdb:
    image: influxdb:2.7
    container_name: cultivia-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------
  # Telegraf: assina cultivia/sensores e grava no InfluxDB (telegraf/telegraf.conf).
  # ---------------------------------------------------------------
  telegraf:
    image: telegraf:1.34
    container_name: cultivia-telegraf
    restart: unless-stopped
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      MQTT_TOPIC: ${MQTT_TOPIC}
      MQTT_TELEGRAF_PASSWORD: ${MQTT_TELEGRAF_PASSWORD}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Grafana: dashboard. Datasource e dashboard vêm prontos de grafana/.
  # ---------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:11.6.0
    container_name: cultivia-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Deixam o dashboard aparecer no iframe do site (web/src/app/(painel)/_components/GrafanaCard.tsx):
      #  ALLOW_EMBEDDING   não bloqueia a página dentro de um iframe
      #  ANONYMOUS_*       quem abrir vê SEM login, só leitura (Viewer).
      #                    Aceitável apenas em rede local!
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      influxdb:
        condition: service_healthy

  # ---------------------------------------------------------------
  # API (FastAPI): ponte entre o site e o MQTT. Código em api/app/.
  # A porta 8000 publicada serve para o `npm run dev` chegar nela direto
  # do host. Toda rota além de /health exige o API_TOKEN.
  # ---------------------------------------------------------------
  api:
    build: ./api
    container_name: cultivia-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_USER: api
      MQTT_PASSWORD: ${MQTT_API_PASSWORD}
      API_TOKEN: ${API_TOKEN}          # a "senha do site" (digitada no login)
    depends_on:
      mosquitto:
        condition: service_healthy

  # ---------------------------------------------------------------
  # Site (Next.js): serve as páginas e repassa /api para a API.
  # Código em web/. Endereço: http://<IP>:8080
  # ---------------------------------------------------------------
  web:
    build: ./web
    container_name: cultivia-web
    restart: unless-stopped
    ports:
      - "8080:3000"                    # 8080 no host -> 3000 do Next.js no container
    depends_on:
      - api

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
  grafana-data:
