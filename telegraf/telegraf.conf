[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true
  skip_processors_after_aggregators = false

# ================= Saída: InfluxDB 2.x =================
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# ================= Entrada: MQTT (Mosquitto) =================
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${MQTT_TOPIC}"]
  client_id = "telegraf-cultivia"
  # Login no Mosquitto. Usuário definido em
  # mosquitto/config/acl; a senha vem do .env via docker-compose.yml.
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  qos = 0
  topic_tag = "topic"

  # Measurement no InfluxDB
  name_override = "estufa"

  # Payload publicado pelas placas (a cada 2s no modo joystick):
  # {"modo": "joystick", "temperatura_simulada": float, "umidade_simulada": float,
  #  "botao_a": 0|1, "botao_c": 0|1, "joystick_sw": 0|1,
  #  "ventilador": 0|1, "bomba": 0|1, "luz": 0|1}   (últimos 3 só no ESP32)
  # Ao entrar no modo microfone, o Pico publica só {"modo": "microfone"} e pausa
  # os envios — por isso todos os campos são opcionais.
  data_format = "json_v2"
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "modo"
      type = "string"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperatura_simulada"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "umidade_simulada"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "botao_a"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "botao_c"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "joystick_sw"
      type = "int"
      optional = true
    # Estado dos atuadores enviado pelo firmware/esp32 (firmware/esp32/main.py,
    # função simula()). Viram campos no InfluxDB para poder plotar no Grafana.
    # `optional = true` porque a BitDogLab não os envia.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "ventilador"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bomba"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "luz"
      type = "int"
      optional = true
