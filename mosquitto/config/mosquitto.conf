# mosquitto/config/mosquitto.conf — configuração do broker MQTT (montada
# dentro do container pelo docker-compose.yml).

# Mosquitto 2.x só aceita localhost por padrão.
# O listener em 0.0.0.0 é obrigatório para as placas conectarem pela rede.
listener 1883 0.0.0.0

# Exige usuário e senha (nada de conexão anônima).
allow_anonymous false
# Arquivo de senhas: NÃO está no repositório. É gerado a cada start do container
# pelo `command:` do serviço mosquitto no docker-compose.yml, a partir do .env.
password_file /mosquitto/passwd
# Permissões por usuário/tópico (arquivo ao lado: acl)
acl_file /mosquitto/config/acl

# Guarda no disco as mensagens retidas (retain), como cultivia/estado e
# os comandos, para sobreviverem a um reinício do broker.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
