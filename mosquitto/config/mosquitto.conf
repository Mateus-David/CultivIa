# sem o 0.0.0.0 o mosquitto 2 só aceita localhost e a placa não conecta
listener 1883 0.0.0.0

allow_anonymous false
# esse arquivo é gerado pelo docker-compose a partir do .env
password_file /mosquitto/passwd
acl_file /mosquitto/config/acl

# salva as mensagens retidas no disco pra não sumirem quando reinicia
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
