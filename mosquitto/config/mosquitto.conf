# Mosquitto 2.x só aceita conexões de localhost por padrão.
# O listener em 0.0.0.0 é obrigatório para o Pico conectar pela rede.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
